version: "2"
sql:
  - engine: postgresql
    schema: db/migrations # o sqlc lê os *.up.sql e ignora os *.down.sql
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: internal/postgres/sqlc
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
